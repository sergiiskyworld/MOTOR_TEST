; Motor thrust test stand - flight controller firmware
; Target board: F405 flight controller (STM32F405RGT6, LQFP64, 8 MHz crystal)
;
; The firmware replaces whatever was on the board (Betaflight/ArduPilot) and is
; flashed straight to 0x08000000 over USB DFU. See docs/FLASHING.md.

[env:f405]
platform        = ststm32
board           = genericSTM32F405RG
framework       = arduino
upload_protocol = dfu
monitor_speed   = 115200

build_flags =
    -O2
    -Wall
    -Wextra
    -Wno-unused-parameter
    -D HSE_VALUE=8000000
    -D USBCON
    -D USBD_USE_CDC
    -D USBD_VID=0x0483
    -D USBD_PID=0x5740
    -D USB_MANUFACTURER="\"MotorTestStand\""
    -D USB_PRODUCT="\"Thrust Stand FC\""
    ; The CDC transmit queue defaults to two 64-byte packets. A telemetry line
    ; is ~330 bytes, so it would be handed over in fragments and the writer
    ; would spin waiting for the host between each one. 16 packets = 1024 bytes
    ; lets a whole line be queued in one go.
    -D CDC_TRANSMIT_QUEUE_BUFFER_PACKET_NUMBER=16
    ; TIM2/TIM3 drive the ESC outputs and TIM7 runs the control loop,
    ; so push the Arduino core's tone/servo timers out of the way.
    -D TIMER_TONE=TIM14
    -D TIMER_SERVO=TIM13
    ; The Arduino core samples for 15 ADC cycles, about 0.7 us. ArduPilot uses
    ; 480 on every channel of this same board, and the flight controller's
    ; sense inputs sit behind a series resistor and a filter capacitor: too
    ; short a window leaves the sample capacitor undercharged, which reads low
    ; on exactly the small signals the current sensor produces. One amp
    ; through a 92.6 A/V sensor is only 11 mV.
    -D ADC_SAMPLINGTIME=ADC_SAMPLETIME_480CYCLES
